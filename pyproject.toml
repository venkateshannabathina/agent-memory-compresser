[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-compressor"
version = "1.0.0"
description = "RL environment for training agents to compress LLM conversation memory"
authors = [
    {name = "Venkatesh Annabathina"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "openai>=1.20.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]